<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Portal Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginHeading">
      <div class="school-mark" aria-hidden="true"><i class="bi bi-mortarboard-fill"></i></div>

      <div class="login-heading">
        <h1 id="loginHeading"><span>Login</span> to your<br class="desktop-break"> Account</h1>
        <p>Please log in to your school account</p>
      </div>

      <div class="role-switch" role="group" aria-label="Choose account type">
        <button type="button" class="role-button active" data-role="student" aria-pressed="true">Student</button>
        <button type="button" class="role-button" data-role="admin" aria-pressed="false">Admin</button>
      </div>

      <form id="loginForm">
        <div class="input-wrap">
          <i class="bi bi-person"></i>
          <input type="text" id="username" placeholder="Username" aria-label="Username" autocomplete="username" required>
        </div>

        <div class="input-wrap password-wrap">
          <i class="bi bi-lock"></i>
          <input type="password" id="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
          <button class="password-toggle" type="button" id="togglePassword" aria-label="Show password" title="Show password">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>

        <div class="forgot-row">
          <button type="button" class="text-link" data-bs-toggle="modal" data-bs-target="#forgotModal">Forgot Password?</button>
        </div>

        <button class="login-button" type="submit">Log in as Student</button>
        <p id="loginMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <div class="signup-line">
        Don't have a student account?
        <button type="button" class="text-link" data-bs-toggle="modal" data-bs-target="#signupModal">Sign up</button>
      </div>

      <div class="back-home">
        <a href="student.html"><i class="bi bi-arrow-left"></i> Back to student portal</a>
      </div>
    </section>
  </main>

  <!-- Password reset dialog -->
  <div class="modal fade" id="forgotModal" tabindex="-1" aria-labelledby="forgotTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content login-modal">
        <div class="modal-header">
          <h5 class="modal-title" id="forgotTitle">Reset password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="forgotForm">
          <div class="modal-body">
            <p class="text-muted">For this project demo, enter the account username and choose a new password.</p>
            <label for="resetUsername" class="form-label">Username</label>
            <input class="form-control mb-3" id="resetUsername" required placeholder="Enter username">
            <label for="newPassword" class="form-label">New password</label>
            <input class="form-control mb-3" type="password" id="newPassword" minlength="6" required placeholder="Enter new password">
            <label for="confirmNewPassword" class="form-label">Confirm new password</label>
            <input class="form-control" type="password" id="confirmNewPassword" minlength="6" required placeholder="Confirm new password">
            <p id="forgotMessage" class="modal-message mb-0" role="status" aria-live="polite"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save new password</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Student sign-up dialog -->
  <div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content login-modal">
        <div class="modal-header">
          <h5 class="modal-title" id="signupTitle">Create a student account</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="signupForm">
          <div class="modal-body">
            <label for="newStudentName" class="form-label">Full name</label>
            <input class="form-control mb-3" id="newStudentName" required placeholder="Enter your full name">
            <label for="newStudentUsername" class="form-label">Username</label>
            <input class="form-control mb-3" id="newStudentUsername" required placeholder="Choose a username">
            <label for="newStudentPassword" class="form-label">Password</label>
            <input class="form-control" type="password" id="newStudentPassword" required minlength="6" placeholder="Create a password">
            <p id="signupMessage" class="modal-message mb-0" role="status" aria-live="polite"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Create account</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /*
      CLASSROOM DEMO ONLY.
      Credentials stored in browser localStorage are not secure.
      Use a server-side authentication system before publishing this portal.
    */
    const DEFAULT_USERNAME = "Aahil";
    const DEFAULT_PASSWORD = "Manu@302009";
    const roles = document.querySelectorAll(".role-button");
    const loginButton = document.querySelector(".login-button");
    let selectedRole = "student";

    function getAccounts() {
      const saved = localStorage.getItem("schoolPortalAccounts");
      if (saved) return JSON.parse(saved);

      const initial = {
        student: [{ username: DEFAULT_USERNAME, password: DEFAULT_PASSWORD, name: "Aahil" }],
        admin: [{ username: DEFAULT_USERNAME, password: DEFAULT_PASSWORD, name: "Aahil" }]
      };
      localStorage.setItem("schoolPortalAccounts", JSON.stringify(initial));
      return initial;
    }

    function saveAccounts(accounts) {
      localStorage.setItem("schoolPortalAccounts", JSON.stringify(accounts));
    }

    roles.forEach((button) => {
      button.addEventListener("click", () => {
        selectedRole = button.dataset.role;
        roles.forEach((item) => {
          const active = item === button;
          item.classList.toggle("active", active);
          item.setAttribute("aria-pressed", String(active));
        });
        loginButton.textContent = selectedRole === "admin" ? "Log in as Admin" : "Log in as Student";
        document.getElementById("loginMessage").textContent = "";
        document.querySelector(".signup-line").style.display = selectedRole === "admin" ? "none" : "block";
      });
    });

    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePassword.addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      eyeIcon.className = show ? "bi bi-eye-slash" : "bi bi-eye";
      togglePassword.setAttribute("aria-label", show ? "Hide password" : "Show password");
      togglePassword.title = show ? "Hide password" : "Show password";
    });

    document.getElementById("loginForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = passwordInput.value;
      const accounts = getAccounts();
      const match = (accounts[selectedRole] || []).find(
        (account) => account.username.toLowerCase() === username.toLowerCase() && account.password === password
      );

      const message = document.getElementById("loginMessage");
      if (!match) {
        message.textContent = "Incorrect username or password. Please try again.";
        message.classList.add("error");
        return;
      }

      message.classList.remove("error");
      message.textContent = "Login successful!";
      // Change these destinations if your project uses different dashboard filenames.
      window.location.href = selectedRole === "admin" ? "admin.html" : "student.html";
    });

    document.getElementById("forgotForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const username = document.getElementById("resetUsername").value.trim();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmNewPassword").value;
      const message = document.getElementById("forgotMessage");

      if (newPassword !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        message.classList.add("error");
        return;
      }

      const accounts = getAccounts();
      let changed = false;
      ["student", "admin"].forEach((role) => {
        const account = (accounts[role] || []).find(
          (item) => item.username.toLowerCase() === username.toLowerCase()
        );
        if (account) {
          account.password = newPassword;
          changed = true;
        }
      });

      if (changed) {
        saveAccounts(accounts);
        message.classList.remove("error");
        message.textContent = "Password updated for the matching account(s). You can now log in with your new password.";
        document.getElementById("forgotForm").reset();
      } else {
        message.textContent = "Username not found.";
        message.classList.add("error");
      }
    });

    document.getElementById("signupForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const name = document.getElementById("newStudentName").value.trim();
      const username = document.getElementById("newStudentUsername").value.trim();
      const password = document.getElementById("newStudentPassword").value;
      const accounts = getAccounts();
      const exists = accounts.student.some((item) => item.username.toLowerCase() === username.toLowerCase());
      const message = document.getElementById("signupMessage");

      if (exists) {
        message.textContent = "That username already exists. Please choose another.";
        message.classList.add("error");
        return;
      }

      accounts.student.push({ name, username, password });
      saveAccounts(accounts);
      message.classList.remove("error");
      message.textContent = "Student account created. You can now log in.";
      document.getElementById("signupForm").reset();
    });

    // Initialise the demo accounts on first visit.
    getAccounts();
  </script>
  <script>
    // Set the default login label when the page loads.
    document.querySelector(".login-button").textContent = "Log in as Student";
  </script>
</body>
</html>
